---
- name: Upgrade all packages (idempotent — apt skips if nothing to update)
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install base packages (minimal — bloat-free)
  ansible.builtin.apt:
    name: "{{ extra_packages }}"
    state: present

- name: Check if reboot is required (kernel/libc update)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Notify if reboot needed (deferred to unattended_upgrades window)
  ansible.builtin.debug:
    msg: "⚠ Reboot required — see /var/run/reboot-required.pkgs"
  when: reboot_required.stat.exists
