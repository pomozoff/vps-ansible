---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Set ufw default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set ufw default outgoing policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow custom SSH port (tcp)
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    comment: "SSH"

- name: Allow HTTP (tcp/80) — required for Let's Encrypt HTTP-01 challenge
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    comment: "HTTP"
  when: firewall_allow_http | default(true)

- name: Allow HTTPS (tcp/443)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    comment: "HTTPS"
  when: firewall_allow_https | default(true)

- name: Allow HTTP/3 QUIC (udp/443)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: udp
    comment: "HTTP/3 QUIC"
  when: firewall_allow_quic | default(true)

- name: Enable ufw logging (low) — track drops without DoS-ing logs
  community.general.ufw:
    logging: "low"

- name: Enable ufw
  community.general.ufw:
    state: enabled
