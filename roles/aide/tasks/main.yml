---
# AIDE — Advanced Intrusion Detection Environment. File-integrity monitoring.
# Snapshot of file hashes + permissions, периодический check на изменения.

- name: Install AIDE
  ansible.builtin.apt:
    name:
      - aide
      - aide-common
    state: present

# Single idempotent shell: skip if active DB exists; wait if init running;
# else fresh init; finally move .new → active. `creates:` makes task skip
# полностью если /var/lib/aide/aide.db уже есть.
- name: Initialize AIDE database (idempotent — handles re-run + parallel safety)
  ansible.builtin.shell: |
    set -euo pipefail
    if [ -f /var/lib/aide/aide.db ]; then
      exit 0
    fi
    if pgrep -fc "aide --init" > /dev/null 2>&1; then
      echo "aideinit already running, waiting..."
      while pgrep -fc "aide --init" > /dev/null 2>&1; do sleep 30; done
    elif [ ! -f /var/lib/aide/aide.db.new ]; then
      aideinit -y -f
    fi
    if [ -f /var/lib/aide/aide.db.new ]; then
      mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db
    fi
  args:
    creates: /var/lib/aide/aide.db
    executable: /bin/bash
  async: 1800      # 30 min timeout (init ~5-15 min на свежей VPS)
  poll: 30

- name: Schedule weekly AIDE check
  ansible.builtin.copy:
    dest: /etc/cron.weekly/aide-check
    mode: "0755"
    content: |
      #!/bin/bash
      # Weekly AIDE integrity check. Diff sent to root@localhost via mail.
      # Setup mail forwarding для prod (postfix relay → external SMTP).
      /usr/bin/aide --check --config=/etc/aide/aide.conf 2>&1 \
        | mail -s "[AIDE] $(hostname) integrity report" root || \
          /usr/bin/aide --check --config=/etc/aide/aide.conf > /var/log/aide-check.log 2>&1
