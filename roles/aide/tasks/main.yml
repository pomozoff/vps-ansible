---
# AIDE — Advanced Intrusion Detection Environment. File-integrity monitoring.
# Snapshot of file hashes + permissions, периодический check на изменения.
#
# Init может занять 5-15 мин на свежей VPS. Поддерживаем:
#   - очистку leftover 0-byte aide.db.new (от killed init)
#   - skip если уже running (другой ansible run)
#   - validate aide.db размер > 0 после move

- name: Install AIDE
  ansible.builtin.apt:
    name:
      - aide
      - aide-common
    state: present

# Single idempotent shell. `creates:` skipа всю задачу если valid aide.db есть.
- name: Initialize AIDE database (idempotent, handles partial state)
  ansible.builtin.shell: |
    set -eu
    DB=/var/lib/aide/aide.db
    NEW=/var/lib/aide/aide.db.new
    # Already valid
    if [ -s "$DB" ]; then exit 0; fi
    # Another init running — wait for it
    if pgrep -fc "aide --config.*--init" > /dev/null; then
      echo "[aide] init in progress, waiting..."
      while pgrep -fc "aide --config.*--init" > /dev/null; do sleep 30; done
    fi
    # Cleanup leftover empty file
    if [ -f "$NEW" ] && [ ! -s "$NEW" ]; then
      echo "[aide] removing empty leftover aide.db.new"
      rm -f "$NEW"
    fi
    # Run init если .new ещё не существует (или мы только что удалили)
    if [ ! -f "$NEW" ]; then
      echo "[aide] running aideinit (5-15 min)"
      aideinit -y -f
    fi
    # Move .new → active если есть valid файл
    if [ -s "$NEW" ]; then
      mv "$NEW" "$DB"
    else
      echo "[aide] FAIL: aide.db.new missing или empty после init"
      exit 1
    fi
  args:
    creates: /var/lib/aide/aide.db
    executable: /bin/bash
  async: 1800      # 30 min timeout
  poll: 30

- name: Verify aide.db не пустой
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db
  register: aide_db_final
  failed_when: aide_db_final.stat.size | int < 1024   # минимум ~1KB для valid DB

- name: Schedule weekly AIDE check
  ansible.builtin.copy:
    dest: /etc/cron.weekly/aide-check
    mode: "0755"
    content: |
      #!/bin/bash
      # Weekly AIDE integrity check. Diff sent to root@localhost via mail.
      # Setup mail forwarding для prod (postfix relay → external SMTP).
      /usr/bin/aide --check --config=/etc/aide/aide.conf 2>&1 \
        | mail -s "[AIDE] $(hostname) integrity report" root || \
          /usr/bin/aide --check --config=/etc/aide/aide.conf > /var/log/aide-check.log 2>&1
