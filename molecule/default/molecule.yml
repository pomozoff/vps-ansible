---
# Molecule test scenario: spawn Ubuntu 24.04 Docker container,
# apply site-baseline.yml against it, verify idempotency (run 2x — second
# run should have 0 changes).
#
# Usage:
#   pip install molecule molecule-plugins[docker] ansible-lint
#   molecule test                       # full lifecycle
#   molecule converge                   # just apply
#   molecule idempotence                # verify no changes 2nd run
#   molecule verify                     # post-checks
#   molecule destroy                    # cleanup
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: docker

platforms:
  - name: ubuntu-24
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    privileged: true                # для systemd/firewall тестов
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /tmp
      - /run

provisioner:
  name: ansible
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      stdout_callback: yaml
  inventory:
    group_vars:
      all:
        # Test-time overrides — без custom ssh port (контейнер уже localhost)
        ssh_port: 22
        new_user: testuser
        ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAITESTKEYINTESTONLY+test@molecule"
        # Skip swap в контейнере (Docker не поддерживает swapfile)
        firewall_allow_http: true
        firewall_allow_https: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
