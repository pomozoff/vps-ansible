---
# Inventory.
#
# Группы:
#   vps_bootstrap — свежий VPS, заходим под root (для первого запуска)
#   vps           — после первого запуска: новый user + custom SSH port
#
# Переключение: после успешного bootstrap закомментируйте host в vps_bootstrap
# и активируйте в vps. Дальше работаем под non-root user.

all:
  children:
    vps_bootstrap:
      hosts:
        # Раскомментируйте + впишите IP когда создаёте новый VPS под root:22.
        # После успешного bootstrap — снова закомментируйте (иначе baseline-run
        # попытается bootstrap уже-настроенный хост и упадёт на root:22).
        # fresh-vps:
        #  ansible_host: 72.56.36.136
        #  ansible_user: root
        #  ansible_port: 22

    vps:
      hosts:
        # После bootstrap. ansible_user / ansible_port подтянутся из group_vars.
        production:
          ansible_host: 72.56.36.136
        # local-test:
        #   ansible_host: 192.168.64.6

      vars:
        ansible_python_interpreter: /usr/bin/python3
